<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D 模型以圖搜圖 v1.6.0</title>
<style>:root{color-scheme:dark;font-family:system-ui,"Microsoft JhengHei",sans-serif}body{margin:0;background:#111827;color:#f9fafb}header{padding:22px;background:#0b1220;position:sticky;top:0;z-index:2}h1{margin:0 0 6px;font-size:24px}.sub{color:#9ca3af;font-size:14px}main{max-width:1200px;margin:auto;padding:24px}.panel{background:#1f2937;border:1px solid #374151;border-radius:16px;padding:18px;margin-bottom:20px}.drop{border:2px dashed #4b5563;border-radius:14px;padding:32px;text-align:center;cursor:pointer}.drop.drag{border-color:#60a5fa;background:#1e3a5f}.pasteHint{margin-top:8px;color:#93c5fd;font-size:13px}button,select{border:0;border-radius:10px;padding:11px 16px;font-size:15px;margin:6px}button{background:#2563eb;color:white;cursor:pointer}select{background:#374151;color:#fff}button.secondary{background:#4b5563}button.warn{background:#d97706}button.danger{background:#dc2626}button.good{background:#059669}button:disabled{opacity:.5;cursor:not-allowed}#queryPreview{max-height:220px;max-width:100%;margin:14px auto 0;display:none;border-radius:10px}.status{margin-top:12px;color:#cbd5e1;overflow-wrap:anywhere}.device{color:#86efac}.row{text-align:center;margin-top:10px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px}.resumeBox{background:#172554;border:1px solid #3b82f6;border-radius:12px;padding:12px;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}.card{background:#1f2937;border:1px solid #374151;border-radius:14px;overflow:hidden}.card img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#0b1220;cursor:zoom-in;transition:transform .15s}.card img:hover{transform:scale(1.015)}.info{padding:12px}.name{font-weight:700;overflow-wrap:anywhere}.score{color:#86efac;margin:6px 0}.tag{display:inline-block;background:#374151;border-radius:999px;padding:3px 8px;font-size:12px;color:#d1d5db;margin-bottom:6px}.path{font-size:12px;color:#9ca3af;overflow-wrap:anywhere;min-height:32px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.download,.location{display:inline-block;text-decoration:none;color:white;padding:8px 11px;border-radius:8px;font-size:14px}.download{background:#059669}.location{background:#4b5563;border:0;cursor:pointer;margin:0}.missing{color:#fca5a5;font-size:13px;margin-top:10px}progress{width:100%;height:12px;margin-top:8px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:50;padding:24px}.modal.open{display:flex}.modalBox{max-width:min(94vw,1400px);max-height:94vh;position:relative;text-align:center}.modal img{max-width:94vw;max-height:82vh;object-fit:contain;border-radius:10px;background:#111}.modalCaption{margin-top:10px;color:#e5e7eb}.modalClose{position:absolute;right:-10px;top:-14px;width:42px;height:42px;border-radius:50%;font-size:25px;background:#dc2626;margin:0;padding:0}</style></head>
<body><header><h1>3D 模型以圖搜圖</h1><div class="sub">GPU、多模型庫、智慧排除材質貼圖、任意層級分類、斷點續建</div></header><main><section class="panel">
<div id="drop" class="drop"><div>拖曳圖片到這裡，或點一下選擇圖片</div><div class="pasteHint">也可直接按 Ctrl + V 貼上截圖或已複製的圖片</div><input id="file" type="file" accept="image/*" hidden><img id="queryPreview" alt="搜尋圖片預覽"></div>
<div class="row"><button id="pasteBtn" class="secondary">貼上剪貼簿圖片</button><label>搜尋模型庫 <select id="searchLibrary"><option value="__all__">全部模型庫</option></select></label><label>搜尋分類 <select id="searchCategory"><option>全部</option></select></label><button id="searchBtn" disabled>開始搜尋</button></div>
<div class="row"><label>目前模型庫 <select id="activeLibrary"></select></label><button id="addLibraryBtn" class="good">＋新增模型庫</button><button id="renameLibraryBtn" class="secondary">重新命名</button><button id="deleteLibraryBtn" class="danger">刪除設定</button></div><div class="row"><label>索引分類 <select id="indexCategory"><option>全部</option></select></label><button id="indexBtn" class="secondary">更新新增／變更圖片</button><button id="fullBtn" class="secondary">完整重建索引</button><button id="pauseBtn" class="warn" hidden>暫停</button><button id="stopBtn" class="danger" hidden>停止並保存進度</button><button id="remapBtn" class="good">修改目前模型庫路徑（保留索引）</button></div>
<div id="resumeBox" class="resumeBox" hidden><span id="resumeText"></span><button id="resumeBtn" class="good">繼續上次進度</button><button id="discardBtn" class="danger">捨棄進度</button></div>
<div id="status" class="status">讀取狀態中…</div><progress id="progress" value="0" max="1" hidden></progress></section><section id="results" class="grid"></section></main>
<div id="imageModal" class="modal" role="dialog" aria-modal="true"><div class="modalBox"><button id="modalClose" class="modalClose" aria-label="關閉">×</button><img id="modalImage" alt="放大預覽"><div id="modalCaption" class="modalCaption"></div></div></div>
<script>
const q=s=>document.querySelector(s),fileInput=q('#file'),drop=q('#drop'),preview=q('#queryPreview'),pasteBtn=q('#pasteBtn'),searchBtn=q('#searchBtn'),indexBtn=q('#indexBtn'),fullBtn=q('#fullBtn'),pauseBtn=q('#pauseBtn'),stopBtn=q('#stopBtn'),remapBtn=q('#remapBtn'),activeLibrary=q('#activeLibrary'),searchLibrary=q('#searchLibrary'),addLibraryBtn=q('#addLibraryBtn'),renameLibraryBtn=q('#renameLibraryBtn'),deleteLibraryBtn=q('#deleteLibraryBtn'),statusEl=q('#status'),results=q('#results'),progress=q('#progress'),searchCategory=q('#searchCategory'),indexCategory=q('#indexCategory'),resumeBox=q('#resumeBox'),resumeText=q('#resumeText'),resumeBtn=q('#resumeBtn'),discardBtn=q('#discardBtn'),imageModal=q('#imageModal'),modalImage=q('#modalImage'),modalCaption=q('#modalCaption'),modalClose=q('#modalClose');let selected=null,lastStatus=null,lastCats='',lastLibs='';
drop.onclick=()=>fileInput.click();['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>choose(e.dataTransfer.files[0]));fileInput.onchange=()=>choose(fileInput.files[0]);function choose(f){if(!f||!f.type.startsWith('image/'))return;selected=f;preview.src=URL.createObjectURL(f);preview.style.display='block';searchBtn.disabled=false;statusEl.textContent='已選擇圖片，可開始搜尋'}
function pastedImage(items){for(const item of items||[]){if(item.type&&item.type.startsWith('image/')){const blob=item.getAsFile?item.getAsFile():item;if(blob){const name=`clipboard_${new Date().toISOString().replace(/[:.]/g,'-')}.png`;choose(new File([blob],name,{type:blob.type||'image/png'}));return true}}}return false}
document.addEventListener('paste',e=>{if(pastedImage(e.clipboardData&&e.clipboardData.items)){e.preventDefault()}});pasteBtn.onclick=async()=>{try{if(!navigator.clipboard||!navigator.clipboard.read)throw new Error('瀏覽器不支援按鈕讀取剪貼簿，請直接按 Ctrl + V');const items=await navigator.clipboard.read();for(const item of items){const type=item.types.find(t=>t.startsWith('image/'));if(type){const blob=await item.getType(type);choose(new File([blob],`clipboard_${Date.now()}.png`,{type}));return}}throw new Error('剪貼簿裡沒有圖片')}catch(e){alert(e.message||'無法讀取剪貼簿，請直接按 Ctrl + V')}};

function fillLibraries(libs,active){const key=JSON.stringify(libs)+active;if(key===lastLibs)return;lastLibs=key;activeLibrary.innerHTML=libs.map(x=>`<option value="${escAttr(x.id)}">${esc(x.name)}</option>`).join('');activeLibrary.value=active;const old=searchLibrary.value;searchLibrary.innerHTML='<option value="__all__">全部模型庫</option>'+libs.map(x=>`<option value="${escAttr(x.id)}">${esc(x.name)}</option>`).join('');if([...searchLibrary.options].some(o=>o.value===old))searchLibrary.value=old}
activeLibrary.onchange=async()=>{const r=await fetch(`/api/libraries/switch?library_id=${encodeURIComponent(activeLibrary.value)}`,{method:'POST'}),d=await r.json();if(!r.ok)alert(d.detail||'切換失敗');lastCats='';lastLibs='';refreshStatus()};
addLibraryBtn.onclick=async()=>{const name=prompt('模型庫名稱（可留空，自動使用資料夾名稱）','');if(name===null)return;const r=await fetch(`/api/libraries/add?name=${encodeURIComponent(name)}`,{method:'POST'}),d=await r.json();alert(d.detail||d.message);lastCats='';lastLibs='';refreshStatus()};
renameLibraryBtn.onclick=async()=>{const cur=(lastStatus.libraries||[]).find(x=>x.id===lastStatus.active_library_id);const name=prompt('新的模型庫名稱',cur?cur.name:'');if(!name)return;const r=await fetch(`/api/libraries/rename?library_id=${encodeURIComponent(activeLibrary.value)}&name=${encodeURIComponent(name)}`,{method:'POST'}),d=await r.json();alert(d.detail||d.message);lastLibs='';refreshStatus()};
deleteLibraryBtn.onclick=async()=>{if(!confirm('確定刪除此模型庫設定？原始模型檔不會刪除。'))return;const delIndex=confirm('是否連同這套模型庫的索引也一起刪除？\n按「取消」只刪設定並保留索引資料。');const r=await fetch(`/api/libraries/${encodeURIComponent(activeLibrary.value)}?delete_index=${delIndex}`,{method:'DELETE'}),d=await r.json();alert(d.detail||d.message);lastCats='';lastLibs='';refreshStatus()};

function fillCategories(cats){const key=JSON.stringify(cats);if(key===lastCats)return;lastCats=key;const oldS=searchCategory.value,oldI=indexCategory.value,opts=['全部',...cats.filter(x=>x!=='全部')];for(const el of [searchCategory,indexCategory]){el.innerHTML=opts.map(x=>`<option value="${escAttr(x)}">${esc(x)}</option>`).join('')}if(opts.includes(oldS))searchCategory.value=oldS;if(opts.includes(oldI))indexCategory.value=oldI}
async function refreshStatus(){try{const s=await fetch('/api/status').then(r=>r.json());lastStatus=s;fillLibraries(s.libraries||[],s.active_library_id);fillCategories(s.categories||[]);const dev=s.device==='cuda'?`GPU：${s.gpu_name||'NVIDIA'}（批次 ${s.batch_size}）`:`CPU（批次 ${s.batch_size}）`;statusEl.innerHTML=`${esc(s.message)}｜<span class="device">${esc(dev)}</span>｜已索引 ${s.indexed} 張｜目前模型庫：${esc(s.active_library_name)}｜${esc(s.library)}`;indexBtn.disabled=s.indexing;fullBtn.disabled=s.indexing;activeLibrary.disabled=s.indexing;addLibraryBtn.disabled=s.indexing;renameLibraryBtn.disabled=s.indexing;deleteLibraryBtn.disabled=s.indexing;remapBtn.disabled=s.indexing||!s.indexed;indexCategory.disabled=s.indexing;pauseBtn.hidden=!s.indexing;stopBtn.hidden=!s.indexing;pauseBtn.textContent=s.paused?'繼續':'暫停';progress.hidden=!(s.indexing||s.mode==='stopped');if(s.total){progress.max=s.total;progress.value=s.done}resumeBox.hidden=!s.resumable||s.indexing;if(s.resumable){resumeText.textContent=`偵測到未完成進度：${s.resumable.category} ${s.resumable.done}/${s.resumable.total}`;}setTimeout(refreshStatus,s.indexing?700:1800)}catch(e){statusEl.textContent='狀態讀取失敗：'+e.message;setTimeout(refreshStatus,2500)}}
indexBtn.onclick=async()=>{await fetch(`/api/reindex?full=false&category=${encodeURIComponent(indexCategory.value)}`,{method:'POST'});refreshStatus()};fullBtn.onclick=async()=>{const c=indexCategory.value;if(confirm(`將重新分析「${c}」的全部圖片，確定繼續？`)){await fetch(`/api/reindex?full=true&category=${encodeURIComponent(c)}`,{method:'POST'});refreshStatus()}};pauseBtn.onclick=async()=>{await fetch(lastStatus&&lastStatus.paused?'/api/index/resume':'/api/index/pause',{method:'POST'});refreshStatus()};stopBtn.onclick=async()=>{if(confirm('停止後會保存目前完成進度，下次可繼續。確定停止？')){await fetch('/api/index/stop',{method:'POST'});refreshStatus()}};resumeBtn.onclick=async()=>{await fetch('/api/index/resume-checkpoint',{method:'POST'});refreshStatus()};discardBtn.onclick=async()=>{if(confirm('確定捨棄未完成進度？正式索引不會被刪除。')){await fetch('/api/index/discard-checkpoint',{method:'POST'});refreshStatus()}};remapBtn.onclick=async()=>{const r=await fetch(`/api/libraries/remap?library_id=${encodeURIComponent(activeLibrary.value)}`,{method:'POST'}),d=await r.json();alert(d.detail||d.message||'完成');refreshStatus()};
function openModal(src,caption){modalImage.src=src;modalCaption.textContent=caption;imageModal.classList.add('open')}function closeModal(){imageModal.classList.remove('open');modalImage.src=''}modalClose.onclick=closeModal;imageModal.onclick=e=>{if(e.target===imageModal)closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
async function openLocation(lib,id,btn){const old=btn.textContent;btn.disabled=true;btn.textContent='開啟中…';try{const r=await fetch(`/api/open-location/${encodeURIComponent(lib)}/${id}`,{method:'POST'}),d=await r.json();if(!r.ok)throw new Error(d.detail||'無法開啟檔案位置')}catch(e){alert(e.message)}finally{btn.disabled=false;btn.textContent=old}}
searchBtn.onclick=async()=>{if(!selected)return;searchBtn.disabled=true;searchBtn.textContent='搜尋中…';results.innerHTML='';const fd=new FormData();fd.append('file',selected);try{const r=await fetch(`/api/search?limit=24&category=${encodeURIComponent(searchCategory.value)}&library_id=${encodeURIComponent(searchLibrary.value)}`,{method:'POST',body:fd}),data=await r.json();if(!r.ok)throw new Error(data.detail||'搜尋失敗');results.innerHTML=data.results.map(x=>`<article class="card"><img class="resultImage" loading="lazy" src="${x.preview_url}" data-caption="${escAttr(`${x.name}｜相似度 ${x.score}%`)}"><div class="info"><div class="tag">${esc(x.library_name)}｜${esc(x.category_path||x.category||'未分類')}</div><div class="name">${esc(x.name)}</div><div class="score">相似度 ${x.score}%</div><div class="path">${esc(x.model||x.image)}</div><div class="actions">${x.model_url?`<a class="download" href="${x.model_url}">下載模型</a>`:'<span class="missing">未找到同名模型檔</span>'}<button class="location" data-id="${x.result_id}" data-library="${escAttr(x.library_id)}">開啟檔案位置</button></div></div></article>`).join('');results.querySelectorAll('.resultImage').forEach(img=>img.onclick=()=>openModal(img.src,img.dataset.caption||''));results.querySelectorAll('.location').forEach(btn=>btn.onclick=()=>openLocation(btn.dataset.library,btn.dataset.id,btn))}catch(e){statusEl.textContent=e.message}finally{searchBtn.disabled=false;searchBtn.textContent='開始搜尋'}};
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function escAttr(s){return esc(s)}refreshStatus();
</script></body></html>
